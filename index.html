<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Life Dashboard</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="dashboard-container">
    
    <!-- HEADER: TIME & GREETING -->
    <header class="card header-card">
      <h1 id="clock">00:00:00</h1>
      <p id="date">Tuesday, January 27, 2026</p>
      <h2 id="greeting">Good Morning</h2>
    </header>

    <div class="main-grid">
      <!-- LEFT COLUMN -->
      <div class="left-column">
        <!-- FOCUS TIMER -->
        <section class="card">
          <h3>Focus Timer</h3>
          <div id="timer">25:00</div>
          <div class="timer-buttons">
            <button id="start-btn" class="btn btn-primary">Start</button>
            <button id="stop-btn" class="btn btn-secondary">Stop</button>
            <button id="reset-btn" class="btn btn-secondary">Reset</button>
          </div>
        </section>

        <!-- QUICK LINKS -->
        <section class="card">
          <h3>Quick Links</h3>
          <div class="input-row">
            <input type="text" id="link-name" placeholder="Link name">
            <input type="text" id="link-url" placeholder="URL">
            <button id="add-link-btn" class="btn btn-primary">Add Link</button>
          </div>
          <div id="quick-links-container" class="links-grid"></div>
        </section>
      </div>

      <!-- RIGHT COLUMN: TASKS -->
      <div class="right-column">
        <section class="card tasks-card">
          <h3>Tasks</h3>
          <div class="input-row">
            <input type="text" id="task-input" placeholder="Add a new task...">
            <button id="add-task-btn" class="btn btn-primary">Add</button>
          </div>
          <ul id="task-list"></ul>
        </section>
      </div>
    </div>

  </div>

  <script src="js/script.js"></script>
</body>
</html>
